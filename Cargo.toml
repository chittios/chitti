[workspace]
resolver = "2"
members = ["xtask"]
# The m1n1 bootloader submodule (third_party/m1n1) carries its own Rust crate
# (rust/Cargo.toml) that it builds standalone via its Makefile. It targets
# aarch64-unknown-none-softfloat and must NOT be unified into this host
# workspace — exclude it so `make -C third_party/m1n1` doesn't error with
# "believes it's in a workspace when it's not".
exclude = ["third_party/m1n1"]

# `kernel/` is intentionally NOT a workspace member: it targets a custom
# no_std triple (targets/x86_64-chitti.json) built with -Z build-std, which
# must not be unified with xtask's ordinary host build. It has its own
# .cargo/config.toml and Cargo.lock.
