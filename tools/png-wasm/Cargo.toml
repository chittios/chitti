[package]
name = "chitti-png-wasm"
version = "0.1.0"
edition = "2021"
publish = false
description = "PNG decoder as a wasm module -- the kernel's own image/png.rs, sandboxed"

# Stand-alone crate (not part of the root workspace / host xtask).
[workspace]

[lib]
# cdylib = the wasm module; rlib lets `cargo test` run the pure parser on the host.
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[profile.release]
# **3, not "s".** Size was copied from `pdf-wasm`, where a module is parsed once per tool call
# and bytes matter more than cycles. A decoder is the opposite: it is the hot path, and `"s"`
# costs real time in inflate's inner loops. 19 KiB -> a few KiB more is a trade worth making.
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[dependencies]
# none — pure no_std + growable bump alloc; inflate is the kernel's own
# `image/inflate.rs` mounted via #[path] (the h264diff pattern).
