[package]
name = "chitti-doc-wasm"
version = "0.1.0"
edition = "2021"
publish = false
description = "Doc agent request router (assets/tools.wasm) — deterministic routing, no model"

# Stand-alone crate (not part of the root workspace / host xtask).
[workspace]

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
