# Mirrors the kernel's arrangement: a custom target JSON plus `build-std`, because there is
# no prebuilt std for a freestanding tenant. Nightly-only, like the kernel.
#
# The default target is x86; `cargo xtask imgdec` passes `--target` explicitly for both, so
# nothing here silently decides which arch you built.
[build]
target = "../../targets/x86_64-chitti-user.json"

[unstable]
# `alloc` too, now that the mounted decoder uses `Vec`. The tenant supplies the allocator
# itself (a bump arena in `.bss`), so this pulls in the collections, not a heap.
build-std = ["core", "compiler_builtins", "alloc"]
build-std-features = ["compiler-builtins-mem"]
json-target-spec = true

# The linker script differs per arch only in the load address (USER_BASE), which is
# 1 GiB on x86 and 256 GiB on aarch64.
[target.x86_64-chitti-user]
rustflags = ["-C", "link-arg=-T../../userspace/imgdec/link-x86_64.ld", "-C", "link-arg=-no-pie"]

[target.aarch64-chitti-user]
rustflags = ["-C", "link-arg=-T../../userspace/imgdec/link-aarch64.ld", "-C", "link-arg=-no-pie"]
