name: release-images

# On a published GitHub Release, build one bootable ChittiOS image per
# architecture — x86_64 (hybrid ISO) and aarch64 (GPT disk image) — and attach
# them as release assets. Also runnable manually (workflow_dispatch), in which
# case the images are only uploaded as workflow artifacts.
#
# **No GGUF is bundled, in either image.** A model is tens of gigabytes and
# cannot be a release asset, so every image boots to the shell and gets its
# model at runtime: `/model remote <url>`, `/model load <file.gguf>` off a
# mounted disk, or `/http -O` then load. Each asset ships a RUN.md saying so.
#
# The kernel embeds the release tag + build time via CHITTI_VERSION /
# CHITTI_BUILD_TIME (kernel/build.rs); local builds fall back to the crate
# version + "dev". xtask's image paths are host-portable: on Linux the aarch64
# GPT disk image is assembled with dosfstools/mtools/e2fsprogs (no root), so
# both arches ship real bootable images from ubuntu runners.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        # **One variant per arch: `no-model`.**
        #
        # The named-model variants only ever selected a kernel heap tier — the
        # GGUF was never bundled (far too large for a release asset), so all
        # five assets per arch booted to the same shell and differed in a heap
        # constant. That is a choice nobody downloading an OS image can make
        # meaningfully, and it multiplied the release by five while implying
        # the model was included.
        #
        # A `no-model` image runs the same three ways: `/model remote` at a
        # hosted endpoint, `/model load` off any mounted disk, or fetch a GGUF
        # with `/http -O` and load that. Heap sizing for a large local model is
        # a `cargo xtask image -model <name>` build, documented in RUN.md.
        model: [no-model]
    steps:
      - uses: actions/checkout@v4

      # Root rust-toolchain.toml = nightly + rust-src + llvm-tools (kernel only:
      # custom targets + `-Z build-std`). The aarch64 UEFI stub pins *stable*
      # via stub/rust-toolchain.toml and is not built with nightly.
      - name: Set up Rust (nightly for OS; stable UEFI target for stub)
        run: |
          rustup show
          rustc --version
          # Stub toolchain (stable + aarch64-unknown-uefi). rustup installs it
          # on first stub build too; do it up front so aarch64 image jobs fail
          # fast with a clear error if the target is unavailable.
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-unknown-uefi --toolchain stable
          rustup target list --toolchain stable --installed

      - name: Embed version + build time
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "CHITTI_VERSION=${{ github.event.release.tag_name }}" >> "$GITHUB_ENV"
          else
            echo "CHITTI_VERSION=$(git describe --tags --always)" >> "$GITHUB_ENV"
          fi
          echo "CHITTI_BUILD_TIME=$(date -u +'%Y-%m-%d %H:%M UTC')" >> "$GITHUB_ENV"

      - name: Install xorriso + Limine (x86_64 ISO only)
        if: matrix.arch == 'x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso
          git clone --depth 1 -b v8.x-binary https://github.com/limine-bootloader/limine.git "$RUNNER_TEMP/limine"
          make -C "$RUNNER_TEMP/limine"
          echo "CHITTI_LIMINE_BIN=$RUNNER_TEMP/limine/limine" >> "$GITHUB_ENV"
          echo "CHITTI_LIMINE_SHARE=$RUNNER_TEMP/limine" >> "$GITHUB_ENV"

      - name: Install image tooling (aarch64 GPT disk image)
        if: matrix.arch == 'aarch64'
        run: |
          sudo apt-get update
          sudo apt-get install -y dosfstools mtools e2fsprogs

      - name: Build image (${{ matrix.arch }})
        run: |
          set -eux
          mkdir -p dist
          NAME="chitti-${{ matrix.arch }}"
          # Desktop build, no GGUF. `-model qwen3.5-0.8b` selects only the
          # default heap tier; `--no-model` is what keeps the weights out.
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            cargo xtask image -model qwen3.5-0.8b --no-model --release
            cp target/chitti.iso "dist/$NAME.iso"
            IMG="$NAME.iso"
          else
            cargo xtask image -arch aarch64 -model qwen3.5-0.8b --no-model --release
            cp target/chitti-aa64.img "dist/$NAME.img"
            IMG="$NAME.img"
          fi
          echo "IMG=$IMG" >> "$GITHUB_ENV"
          echo "NAME=$NAME" >> "$GITHUB_ENV"

      - name: Package with RUN.md
        run: |
          set -eux
          cat > "dist/${NAME}.RUN.md" <<EOF
          # ChittiOS ${CHITTI_VERSION} - ${{ matrix.arch }}

          Bootable image: \`${IMG}\`.

          ## Caution

          Research software. Interfaces, on-disk formats and behaviour change
          without notice. **Boot it from removable media or in a VM, not on a
          machine whose data you care about.** See HARDWARE.md in the repo for
          what works on real hardware and what does not — in particular there is
          no WiFi driver that can join a network.

          ## Verify it first

          The Releases page carries a \`${NAME}.sha256\` alongside the image. A
          truncated download boots into a failure that looks like a broken OS
          rather than a broken transfer, so it is worth thirty seconds:

              sha256sum -c ${NAME}.sha256      # Linux
              shasum -a 256 -c ${NAME}.sha256  # macOS

          ## Run it

          x86_64 (hybrid ISO, BIOS or UEFI):

              qemu-system-x86_64 -M q35 -cpu max -m 2G -cdrom ${NAME}.iso -serial stdio

          aarch64 (raw GPT disk image, boots standalone via UEFI):

              write it to a USB stick with balenaEtcher or dd, or attach it as a
              VM disk (UTM / VirtualBox-ARM / QEMU + AAVMF)

          In a VM, set the pointing device to **USB Tablet** and the keyboard to
          **USB** so the HID drivers pick them up, and enable EFI.

          ## Getting a model

          **No model is bundled** — a GGUF is far too large for a release asset.
          The image boots to the shell without one; give it a model any of three
          ways:

              /model remote http://host:port [name]   # llama.cpp server, Ollama, vLLM
              /model load /path/to/file.gguf          # from any mounted disk
              /http -O <url>                          # fetch one, then /model load

          To bake in a larger heap tier for a big local model, build from source:

              cargo xtask image -model qwen3.5-4b        # or -9b, gemma-4-e4b
              ./xtask/fetch-model.sh qwen3.5-4b

          ## First steps

              /help          the searchable command browser
              /about         version and build
              /disks         what storage was found
              /network dhcp  get an address
          EOF
          tar -czf "dist/${NAME}.tar.gz" -C dist "${IMG}" "${NAME}.RUN.md"
          ls -la dist

      # A checksum, because these are bootable images someone will write to a
      # USB stick. A truncated download produces a disk that fails in a way that
      # looks like a broken OS rather than a broken transfer.
      - name: Checksum
        run: |
          set -eux
          cd dist
          sha256sum "${IMG}" "${NAME}.tar.gz" > "${NAME}.sha256"
          cat "${NAME}.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: |
            dist/${{ env.NAME }}.tar.gz
            dist/${{ env.NAME }}.sha256

      # Everything lands on the Releases page: the raw image (write it straight
      # to a USB stick), the tarball (image + RUN.md), and the checksums.
      #
      # The raw image is attached *as well as* the tarball on purpose — it used
      # to exist only in the R2 mirror, so removing that would have left anyone
      # wanting a `.iso`/`.img` for Etcher or `dd` having to download and unpack
      # a tarball first.
      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ env.IMG }}
            dist/${{ env.NAME }}.tar.gz
            dist/${{ env.NAME }}.sha256
