name: ci

# Build + unit tests, one job per architecture (`unit (x86_64)`, `unit (aarch64)`).
#
# The end-to-end suite (`make e2e`) is deliberately NOT run here — it boots the
# real kernel under QEMU and is run locally before shipping boot-visible or
# networked changes (see tests/e2e/README.md).
#
# FORK-PR SAFETY (why this can't be exploited by a malicious pull request):
#   * Trigger is `pull_request`, NOT `pull_request_target`. A PR from a fork
#     therefore runs with a **read-only** GITHUB_TOKEN and **no access to
#     secrets** — the untrusted code has nothing to steal or push with. Do NOT
#     change this to `pull_request_target` (that runs untrusted PR code in the
#     base-repo context WITH secrets — the classic CI takeover).
#   * `permissions:` is `contents: read` only, so even the token this workflow
#     does get can't write to the repo, releases, packages, or issues.
#   * No secrets are referenced anywhere; this workflow needs none.
#   * Only GitHub-hosted runners are used (never self-hosted — a fork PR on a
#     self-hosted runner is arbitrary code execution on your own infra).
#   * `actions/checkout` is pinned to a commit SHA and checks out with
#     `persist-credentials: false`, so the token isn't left in `.git/config`
#     for the untrusted build steps that follow.
# Net effect: a hostile PR can at worst waste ephemeral runner minutes.

on:
  push:
    branches: [main, master]
  pull_request:

# Least privilege: read the code, nothing else.
permissions:
  contents: read

# One run per ref; cancel superseded runs (a force-push supersedes its predecessor).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The dual-arch rule (CLAUDE.md) says a change must build for BOTH x86_64 and
  # aarch64, so each arch is its own matrix leg: they run in parallel and a
  # failure names the arch in the job title instead of being buried in one log.
  #
  # **Both legs run the in-kernel unit suite.** They report a verdict by different
  # means, because the hardware differs: x86 boots a Limine ISO and exits through
  # `isa-debug-exit`, giving a real process status; aarch64 has no such device on
  # `-M virt`, so it boots a flat arm64 `Image` with `-kernel` and the runner reads
  # a sentinel line off the serial console (`kernel/src/qemu.rs`). Adding the
  # aarch64 half needed a `cfg(test)` `aarch64_start` in lib.rs — the stub's
  # `_start` branches to a symbol that otherwise only exists in `main.rs`.
  #
  # Both legs run on the ARM runner *on purpose*. `cargo xtask test` boots the
  # x86 guest under TCG (`-cpu max`) there, exactly as this job always has;
  # moving the x86 leg to `ubuntu-24.04` would let `xtask`'s `accel_args` pick
  # up `/dev/kvm` and run `-accel kvm -cpu host` instead, which is much faster
  # but changes the guest's CPU feature set (RDRAND et al.) and cannot be
  # validated from an Apple-Silicon dev box. It's a one-line `runner:` change
  # here if you want to try it. The aarch64 leg picks up `/dev/kvm` by itself if
  # the runner ever offers it (see `run_test_binary_aarch64`), since a real GICv3
  # is all it needs — it is only HVF that cannot host that suite.
  unit:
    name: unit (${{ matrix.arch }})
    # NB `matrix.runner`, not `matrix.runs-on`: an expression property name with
    # a hyphen parses as a subtraction (`matrix.runs` - `on`), which evaluates
    # to a number and leaves `runs-on` empty.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      # Report both arches every run — a divergence usually breaks exactly one,
      # and cancelling the other leg hides whether it was arch-specific.
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04-arm
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout (no persisted credentials)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # The two legs boot their guest completely differently, so they need
      # different packages: x86 wraps the test binary in a Limine ISO (hence
      # xorriso + mtools), while aarch64 objcopies it to a flat arm64 `Image` and
      # boots it with `-kernel` (no bootloader, no ISO). `llvm-objcopy` comes from
      # the toolchain's `llvm-tools` component, which rust-toolchain.toml pins.
      - name: Install QEMU (x86 guest, via TCG) + ISO tools
        if: matrix.arch == 'x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 xorriso mtools

      - name: Install QEMU (aarch64 guest)
        if: matrix.arch == 'aarch64'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-arm

      # Ubuntu's apt `limine` is too old for the `limine.conf` (v8+) the kernel
      # uses, so clone a pinned Limine *binary* release and point xtask at it via
      # CHITTI_LIMINE_SHARE/BIN. Fork-PR-safe: a public git clone over HTTPS, no
      # secrets, pinned to a branch; the `limine` host tool is built with the
      # runner's cc.
      - name: Install Limine (pinned binary release for the x86 boot ISO)
        if: matrix.arch == 'x86_64'
        run: |
          git clone --depth 1 --branch v8.x-binary https://github.com/limine-bootloader/limine.git "$RUNNER_TEMP/limine"
          make -C "$RUNNER_TEMP/limine"
          echo "CHITTI_LIMINE_SHARE=$RUNNER_TEMP/limine" >> "$GITHUB_ENV"
          echo "CHITTI_LIMINE_BIN=$RUNNER_TEMP/limine/limine" >> "$GITHUB_ENV"

      - name: Rust toolchain (from rust-toolchain.toml — nightly + rust-src + llvm-tools)
        run: rustup show && rustc --version

      - name: Build (${{ matrix.arch }})
        run: cargo xtask build -arch ${{ matrix.arch }}

      - name: Unit tests (in-kernel, ${{ matrix.arch }} guest under QEMU/TCG)
        run: cargo xtask test -arch ${{ matrix.arch }}
