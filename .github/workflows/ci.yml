name: ci

# Build + unit tests + end-to-end tests.
#
# FORK-PR SAFETY (why this can't be exploited by a malicious pull request):
#   * Trigger is `pull_request`, NOT `pull_request_target`. A PR from a fork
#     therefore runs with a **read-only** GITHUB_TOKEN and **no access to
#     secrets** — the untrusted code has nothing to steal or push with. Do NOT
#     change this to `pull_request_target` (that runs untrusted PR code in the
#     base-repo context WITH secrets — the classic CI takeover).
#   * `permissions:` is `contents: read` only, so even the token this workflow
#     does get can't write to the repo, releases, packages, or issues.
#   * No secrets are referenced anywhere; this workflow needs none.
#   * Only GitHub-hosted runners are used (never self-hosted — a fork PR on a
#     self-hosted runner is arbitrary code execution on your own infra).
#   * `actions/checkout` is pinned to a commit SHA and checks out with
#     `persist-credentials: false`, so the token isn't left in `.git/config`
#     for the untrusted build steps that follow.
# Net effect: a hostile PR can at worst waste ephemeral runner minutes.

on:
  push:
    branches: [main, master]
  pull_request:

# Least privilege: read the code, nothing else.
permissions:
  contents: read

# One run per ref; cancel superseded runs (a force-push supersedes its predecessor).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cross-build both arches and run the in-kernel unit suite (pure logic — no
  # model/network/hardware). The suite is x86: `cargo xtask test` builds an
  # x86_64-chitti kernel, wraps it in a Limine ISO, and boots it under
  # qemu-system-x86_64. On this aarch64 runner the x86 build cross-compiles
  # (rust-lld, no external toolchain) and QEMU runs the guest under TCG.
  #
  # The x86 boot ISO needs Limine + xorriso (mtools too, for FAT paths). Ubuntu's
  # apt `limine` is too old for the `limine.conf` (v8+) the kernel uses, so we
  # clone a pinned Limine *binary* release and point xtask at it via
  # CHITTI_LIMINE_SHARE/BIN. Fork-PR-safe: a public git clone over HTTPS, no
  # secrets, pinned to a branch; the `limine` host tool is built with the runner's
  # cc.
  unit:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - name: Checkout (no persisted credentials)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install QEMU (x86 guest, via TCG) + ISO tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 xorriso mtools

      - name: Install Limine (pinned binary release for the x86 boot ISO)
        run: |
          git clone --depth 1 --branch v8.x-binary https://github.com/limine-bootloader/limine.git "$RUNNER_TEMP/limine"
          make -C "$RUNNER_TEMP/limine"
          echo "CHITTI_LIMINE_SHARE=$RUNNER_TEMP/limine" >> "$GITHUB_ENV"
          echo "CHITTI_LIMINE_BIN=$RUNNER_TEMP/limine/limine" >> "$GITHUB_ENV"

      - name: Rust toolchain (from rust-toolchain.toml — nightly + rust-src + llvm-tools)
        run: rustup show && rustc --version

      - name: Build (x86_64)
        run: cargo xtask build -arch x86_64

      - name: Build (aarch64)
        run: cargo xtask build -arch aarch64

      - name: Unit tests (in-kernel, x86 under QEMU/TCG)
        run: cargo xtask test

  # End-to-end: boot the real kernel under QEMU and drive the shell over serial,
  # exercising the os + net + agents groups — every OS command, the
  # http/https/ws/wss/ping flows against local host servers, agent
  # install/consent + service lifecycle, registry, and UI surfaces (tests/e2e/).
  #
  # Runs on x86_64 `ubuntu-latest`, which exposes /dev/kvm, so xtask boots the
  # kernel with `-accel kvm` (near-native) instead of TCG software emulation.
  # This replaced an aarch64 runner: GitHub's arm64 hosted runners don't expose
  # KVM, so the guest ran under TCG and was too slow to boot in time / crashed.
  # The x86 kernel is wrapped in a Limine boot ISO (needs Limine + xorriso +
  # mtools — the same path the unit job uses). Boot is headless: the harness
  # sets CHITTI_DISPLAY=none (guest.py), so QEMU runs serial-only (no display on
  # a hosted runner). Ubuntu's system python3 (OpenSSL 3) runs https/wss with no
  # extra deps.
  #
  # The --slow local-inference and voice groups are NOT run here (CPU LLM
  # inference is impractical in CI); use `make e2e-full` locally for those. The
  # 0.8B GGUF is still fetched because the main guest boots with `-model` — it's
  # loaded into RAM but never driven for inference in the non-slow groups.
  #
  # Fork-PR-safe: public Limine + HuggingFace fetches over HTTPS, no secrets,
  # GitHub-hosted runner only, read-only token.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout (no persisted credentials)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Enable /dev/kvm access (for -accel kvm)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || echo "WARN: no /dev/kvm — xtask will fall back to TCG"

      - name: Install QEMU (x86_64) + ISO tools + openssl/curl
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 xorriso mtools openssl curl ca-certificates

      - name: Install Limine (pinned binary release for the x86 boot ISO)
        run: |
          git clone --depth 1 --branch v8.x-binary https://github.com/limine-bootloader/limine.git "$RUNNER_TEMP/limine"
          make -C "$RUNNER_TEMP/limine"
          echo "CHITTI_LIMINE_SHARE=$RUNNER_TEMP/limine" >> "$GITHUB_ENV"
          echo "CHITTI_LIMINE_BIN=$RUNNER_TEMP/limine/limine" >> "$GITHUB_ENV"

      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup show && rustc --version

      # Warm the cargo cache BEFORE the e2e boot loop. `cargo xtask run` (spawned
      # per boot attempt) otherwise does a cold nightly + build-std kernel build
      # *inside* run.py's 120 s boot-marker deadline — the build alone exceeds
      # 120 s, so every attempt times out mid-compile (and the retry kills the
      # build). Pre-building here means the guest boots immediately under KVM.
      - name: Pre-build the kernel (x86_64) to warm the cache
        run: cargo xtask build -arch x86_64

      - name: Fetch the model (Qwen3.5-0.8B GGUF, ~812 MB, public HuggingFace)
        run: make model

      - name: End-to-end tests (os + net + agents, x86_64 under QEMU/KVM)
        run: make e2e ARCH=x86_64
