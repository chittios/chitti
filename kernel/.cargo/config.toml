[build]
target = "../targets/x86_64-chitti.json"
rustflags = ["-C", "link-arg=-Tlinker.ld"]

[unstable]
build-std = ["core", "compiler_builtins", "alloc"]
build-std-features = ["compiler-builtins-mem"]
json-target-spec = true

[target.x86_64-chitti]
runner = "../xtask/run-test-in-qemu.sh"

# aarch64 native port: its own linker script (direct `-M virt -kernel` boot).
# Target-specific rustflags REPLACE `[build].rustflags` for this target, so it
# gets `-Tlinker-aarch64.ld` instead of the x86 `-Tlinker.ld`.
#
# Linked as a **position-independent executable** (`-pie` + `relocation-model:
# pic` in the target JSON) so the kernel can run wherever it is loaded — m1n1
# loads it at Apple's ~32 GiB RAM base, not the 0x40080000 link address. The
# linker emits `R_AARCH64_RELATIVE` records into `.rela.dyn`; `_start` applies
# them (delta = runtime − link base) before any absolute-addressed code runs.
# `--no-dynamic-linker` (no PT_INTERP — there is no loader) and `-z norelro`
# (no RELRO segment) keep it a plain flat image. On QEMU `-kernel` the image
# loads at its link address so delta = 0 and the relocation pass is a no-op.
[target.aarch64-chitti]
# `cargo xtask test -arch aarch64` boots each compiled test binary through the
# same runner the x86 target uses; it dispatches on the binary's own ELF
# `e_machine`, since cargo passes it nothing but a path. NB the aarch64 test
# binary has no `main.rs`, so `arch::aarch64::boot`'s `_start` branches to an
# `aarch64_start` that `lib.rs` supplies under `cfg(test)` — without it this
# target links only the real kernel, not the suite.
runner = "../xtask/run-test-in-qemu.sh"
rustflags = [
    "-C", "link-arg=-Tlinker-aarch64.ld",
    "-C", "link-arg=-pie",
    "-C", "link-arg=--no-dynamic-linker",
    "-C", "link-arg=-znorelro",
]
