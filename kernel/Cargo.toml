[package]
name = "chitti-kernel"
version = "0.1.0"
edition = "2021"

# Stand-alone crate: do NOT let cargo pull this into the repo-root workspace
# (which builds xtask for the host). This crate has its own target/build-std
# config in .cargo/config.toml and must not be feature/target-unified with it.
[workspace]

[lib]
name = "chitti_kernel"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "chitti-kernel"
path = "src/main.rs"
test = false
doctest = false
bench = false

[features]
# `cargo xtask ref-check` builds with this on: at boot the kernel runs the
# full Phase 3 acceptance gate (parity + determinism + KV evict/recompute +
# batching) against the real model, then exits QEMU with a pass/fail code.
# A normal `cargo xtask run` (feature off) just runs the single-stream
# inference demo and stays up.
refcheck = []

# Model-size selectors. The memory *layout* is no longer hardcoded per model: the
# model always loads at cortex::MODEL_LOAD_ADDR and the heap is placed by `mm`
# from discovered RAM (DTB on `-kernel`, the UEFI stub on real hardware). These
# features now only pick the heap *size* tier (mm::heap::HEAP_SIZE) and the model
# name string. Default (both off) = the 0.8B model (256 MiB heap).
# `cargo xtask build|run -model qwen3.5-9b`: the ~5 GiB Qwen3.5-9B (1 GiB heap).
model-9b = []
# `cargo xtask build|run -model qwen3.5-4b`: the ~2.6 GiB Qwen3.5-4B (512 MiB heap).
model-4b = []
# `cargo xtask build|run -model qwen3.5-2b`: the ~1.2 GiB Qwen3.5-2B (512 MiB heap).
model-2b = []

# aarch64 only: build the kernel to boot via the Limine boot protocol
# (BOOTAA64.EFI under UEFI/AAVMF) so it can boot from a disk's ESP, instead of
# the default `-M virt -kernel` custom boot stub. Selects the Limine entry +
# higher-half linker script (linker-aarch64-limine.ld, passed via RUSTFLAGS by
# xtask) and reads memmap/framebuffer/model from Limine responses. The fast
# `-kernel -accel hvf` dev path is the default (feature off).
boot-limine = []

[dependencies]
# Shared-contract serialization for the agentic re-architecture
# (CHITTI_SCHEMAS.md). All no_std + alloc, none pull `std`:
#   serde   — derive for the AgentManifest/Session/SkillManifest structs
#   postcard — compact no_std wire format for the persistent store
#   bitflags — the `Rights` flag set, with serde support
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }
bitflags = { version = "2", default-features = false, features = ["serde"] }

# smoltcp — the no_std TCP/IP stack behind the net subsystem (virtio-net / e1000
# drivers feed it raw Ethernet frames via its phy::Device trait). alloc-backed
# socket set; Ethernet + IPv4 + DHCPv4 + DNS + ICMP (ping) + TCP/UDP.
smoltcp = { version = "0.11", default-features = false, features = [
    "alloc", "medium-ethernet", "proto-ipv4", "proto-dhcpv4",
    "socket-tcp", "socket-udp", "socket-icmp", "socket-dhcpv4", "socket-dns",
] }

# No per-profile `panic = "abort"` override here: the target spec's own
# "panic-strategy": "abort" is already authoritative. Adding an explicit
# `-C panic=abort` on top of that makes this package's root profile diverge
# from -Z build-std's canonical sysroot profile, which cargo then builds as
# a *second* copy of core/alloc — and any ordinary (non-build-std) dependency
# ends up linked against a mix of the two ("duplicate lang item" errors).
