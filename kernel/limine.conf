timeout: 0

/Chitti OS
    protocol: limine
    path: boot():/boot/chitti-kernel
    # NOTE: the `module_path: boot():/boot/model.gguf` line is appended by
    # xtask *only* when the image actually bundles the model. Limine panics
    # at boot if a declared module is missing, so it must not be static
    # (the fast test image is built without the ~812 MB model).
