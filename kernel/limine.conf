timeout: 0

/ChittiOS
    protocol: limine
    # Ask for a QHD framebuffer (Limine falls back to the best native mode if
    # the display can't do it) — the firmware default is often a tiny
    # 1024x768/1280x800 surface on QEMU/VirtualBox. 2560x1440 matches what the
    # aarch64 stub's GOP best-mode picks on the same monitors, so x86 and
    # aarch64 render identically.
    resolution: 2560x1440
    path: boot():/boot/chitti-kernel
    # NOTE: the `module_path: boot():/boot/model.gguf` line is appended by
    # xtask *only* when the image actually bundles the model. Limine panics
    # at boot if a declared module is missing, so it must not be static
    # (the fast test image is built without the ~812 MB model).
