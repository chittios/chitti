timeout: 0

/ChittiOS
    protocol: limine
    # NO hardcoded `resolution:` — Limine then queries the display's **EDID** and
    # uses its preferred (native) timing, falling back to 1024x768 only when the
    # display reports no EDID at all. That is the same discovery the aarch64 UEFI
    # stub does (`kernel/src/edid.rs`), so both arches land on the same mode for
    # the same monitor.
    #
    # This line used to pin `resolution: 2560x1440`, which meant the console came
    # up at a fixed QHD surface on every machine and every hypervisor regardless
    # of the display or the VM's configured resolution — the "resolution is const,
    # not dynamic" symptom on VirtualBox. Do not reintroduce a constant here.
    #
    # To pin a mode anyway (a headless VM with no EDID, or to match a specific
    # window size), build the image with:
    #     CHITTI_RESOLUTION=1920x1080 cargo xtask image -arch x86_64
    # xtask appends the `resolution:` line only when that variable is set.
    path: boot():/boot/chitti-kernel
    # NOTE: the `module_path: boot():/boot/model.gguf` line is appended by
    # xtask *only* when the image actually bundles the model. Limine panics
    # at boot if a declared module is missing, so it must not be static
    # (the fast test image is built without the ~812 MB model).
